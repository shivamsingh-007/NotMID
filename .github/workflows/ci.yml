name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patient-case-taking-platform
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: python -m pip install -e "./apps/api[dev]"

      - name: Lint Python
        run: python -m ruff check apps/api/app apps/api/tests apps/api/tools

      - name: Type check Python
        run: python -m mypy --config-file apps/api/pyproject.toml apps/api/app apps/api/tools

      - name: Test Python
        run: python -m pytest apps/api/tests -q

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: patient-case-taking-platform/apps/*/package-lock.json

      - name: Install, lint, and build frontends
        shell: bash
        run: |
          set -euo pipefail
          for app in apps/patient-kiosk apps/clinician-console apps/admin-console; do
            npm --prefix "$app" ci
            npm --prefix "$app" run lint
            npm --prefix "$app" run build
          done

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patient-case-taking-platform
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r apps/api/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: patient-case-taking-platform/apps/*/package-lock.json

      - name: Check Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          for app in apps/patient-kiosk apps/clinician-console apps/admin-console; do
            npm --prefix "$app" ci --ignore-scripts
            audit_status=1
            for attempt in 1 2 3; do
              if npm --prefix "$app" audit --audit-level=high \
                --fetch-retries=1 \
                --fetch-retry-mintimeout=5000 \
                --fetch-retry-maxtimeout=10000 \
                --fetch-timeout=60000; then
                audit_status=0
                break
              else
                audit_status=$?
              fi

              if [ "$attempt" -lt 3 ]; then
                echo "npm audit failed for $app (attempt $attempt); retrying in 10 seconds" >&2
                sleep 10
              fi
            done

            if [ "$audit_status" -ne 0 ]; then
              exit "$audit_status"
            fi
          done
